[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "22"
  PNPM_VERSION = "11.1.1"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/media/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
