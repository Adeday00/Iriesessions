  <rect width="1200" height="1500" fill="#f2eee4"/>
  <path d="M0 0h1200v260H0z" fill="#111"/>
  <path d="M0 1240h1200v260H0z" fill="#111"/>
  <circle cx="1000" cy="470" r="320" fill="#ff6a2b"/>
  <circle cx="1080" cy="470" r="210" fill="#b9ff3b"/>
  <path d="M-80 980C220 700 420 1180 760 850s530-70 620 40v350H-80z" fill="#ff6a2b"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-weight="900">
